<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veterinaria San Roque - Turnos</title>
    <meta name="description" content="Gestión de turnos y pacientes para Veterinaria San Roque">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Veterinaria San Roque</h1>
        <p>Gestión de Turnos y Mascotas</p>
    </header>

    <main class="container">
        <!-- Sección de Formulario -->
        <section class="form-section">
            <div class="card">
                <h2>Nuevo Turno</h2>
                <form id="turno-form">
                    <div class="form-group">
                        <label for="mascota">Mascota</label>
                        <select id="mascota" required>
                            <option value="">Cargando mascotas...</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="fecha">Fecha</label>
                            <input type="date" id="fecha" required>
                        </div>
                        <div class="form-group">
                            <label for="hora">Hora</label>
                            <input type="time" id="hora" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="motivo">Motivo de la visita</label>
                        <textarea id="motivo" rows="3" placeholder="Ej: Vacunación anual..." required></textarea>
                    </div>

                    <button type="submit" class="btn-primary">Registrar Turno</button>
                    <div id="mensaje-estado" class="mensaje"></div>
                </form>
            </div>
        </section>

        <!-- Sección de Listado -->
        <section class="list-section">
            <h2>Turnos Programados</h2>
            <div id="turnos-container" class="turnos-grid">
                <div class="loading">Cargando turnos...</div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Veterinaria San Roque. Todos los derechos reservados.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
